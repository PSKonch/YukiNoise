map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # FastAPI's Swagger HTML uses these absolute URLs even when /docs is proxied
    # through the /api prefix.
    location = /openapi.json {
        proxy_pass http://app:8000/openapi.json;
    }

    location = /docs/oauth2-redirect {
        proxy_pass http://app:8000/docs/oauth2-redirect;
    }

    # OpenAPI operation paths are absolute (/tracks, /me, /auth, ...). Proxy
    # them as API calls as well, otherwise the SPA fallback returns index.html.
    location ~ ^/(auth|users|artists|me|playlists|posts|releases|tracks|commentaries|likes|follows|health|metrics)(/|$) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # The HTML shell must always be revalidated. Hashed Vite assets may be
    # cached forever, but caching index.html would keep a removed bundle alive
    # after a container rebuild and make the browser display a stale UI.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
