services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yukinoise
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/primary-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yukinoise" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db_replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    command: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yukinoise" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
    command: alembic upgrade head

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  kafka-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /var/lib/kafka-data"]
    volumes:
      - kafka_data:/var/lib/kafka-data

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    ports:
      - 9090:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: 1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REPLICA_LAG_THRESHOLD_BYTES: 16777216
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
    ports:
      - "8000:8000"
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: uvicorn yn.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "5173:80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: taskiq worker yn.tasks:broker

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: taskiq scheduler yn.tasks.scheduler:scheduler yn.tasks

volumes:
  postgres_data:
  postgres_replica_data:
  minio_data:
  track_upload_tmp:
  kafka_data:
  redis_data:
