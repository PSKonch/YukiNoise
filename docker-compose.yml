services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yukinoise
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/primary-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yukinoise" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db_replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    command: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yukinoise" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
    command: alembic upgrade head

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    ports:
      - 9090:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus_data/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      redis:
        condition: service_started
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: 1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REPLICA_LAG_THRESHOLD_BYTES: 16777216
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: uvicorn yn.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: taskiq worker yn.tasks:broker

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_PRIMARY_USER: postgres
      POSTGRES_PRIMARY_PASSWORD: postgres
      POSTGRES_PRIMARY_DB: yukinoise
      POSTGRES_PRIMARY_HOST: db
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: postgres
      POSTGRES_REPLICA_PASSWORD: postgres
      POSTGRES_REPLICA_DB: yukinoise
      POSTGRES_REPLICA_HOST: db_replica
      POSTGRES_REPLICA_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      UPLOAD_TEMP_DIR: /tmp/yukinoise/uploads
    volumes:
      - ./src:/opt/app/src
      - track_upload_tmp:/tmp/yukinoise/uploads
    command: taskiq scheduler yn.tasks.scheduler:scheduler yn.tasks

volumes:
  postgres_data:
  postgres_replica_data:
  minio_data:
  track_upload_tmp:
  redis_data:
