[project]
name = "yukinoise"
version = "0.1.0"
description = ""
authors = [
    {name = "psk",email = "shaban.benito.dimitri@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aio-pika (>=9.6.2,<10.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-multipart (>=0.0.28,<0.0.29)",
    "alembic (>=1.18.4,<2.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "taskiq (>=0.12.4,<0.13.0)",
    "taskiq-aio-pika (>=0.6.0,<0.7.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "faststream[kafka] (>=0.7.3,<0.8.0)"
]

[tool.poetry]
packages = [
    { include = "yn", from = "src" },
]

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
mypy_path = "src"
exclude = [
    "venv/",
    ".venv/",
    "migrations",
    "scripts",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["hvac.*", "asyncssh.*", "aiokafka.*"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["FAST", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-passlib (>=1.7.7.20260211,<2.0.0.0)"
]
